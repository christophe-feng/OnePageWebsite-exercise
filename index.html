<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Together | 天天玩樂園</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-sm bg-warning navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Play Together</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#intro">玩法介紹</a></li>
                    <li class="nav-item"><a class="nav-link" href="#recommend">玩家推薦</a></li>
                    <li class="nav-item"><a class="nav-link" href="#download">如何下載</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="./image/playtogether-1.webp" class="d-block w-100" alt="Banner 1">
            </div>
            <div class="carousel-item">
                <img src="./image/playtogether-2.webp" class="d-block w-100" alt="Banner 2">
            </div>
            <div class="carousel-item">
                <img src="./image/playtogether-3.jpg" class="d-block w-100" alt="Banner 3">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <section id="intro" class="container">
        <div class="text-center mb-5">
            <h2 class="fw-bold">歡迎來到天天玩樂園</h2>
            <p class="text-muted">體驗最豐富的虛擬社交生活</p>
        </div>

        <div class="row align-items-center">
            <div class="col-md-6 mb-4">
                <img src="./image/playtogether-4.webp" class="img-fluid rounded-4 shadow" alt="Intro">
            </div>
            <div class="col-md-6">
                <div id="gameplayCarousel" class="carousel slide border rounded-4 overflow-hidden"
                    data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="./image/playtogether-catchingbugs.webp" class="d-block w-100"
                                style="height:350px;" alt="Catching Bugs">
                            <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50">
                                <h5>昆蟲採集</h5>
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="./image/playtogether-fishing.webp" class="d-block w-100" style="height:350px;"
                                alt="Fishing">
                            <div class="carousel-caption d-none d-md-block bg-dark bg-opacity-50">
                                <h5>歡樂釣魚</h5>
                            </div>
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#gameplayCarousel"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#gameplayCarousel"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <section id="recommend" class="bg-white">
        <div class="container">
            <h2 class="text-center fw-bold mb-5">玩家精彩推薦</h2>
            <div class="row">
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="video-container ratio ratio-16x9">
                        <iframe src="https://www.youtube.com/embed/lNcAPQFCwBc" title="Video 1"
                            allowfullscreen></iframe>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="video-container ratio ratio-16x9">
                        <iframe src="https://www.youtube.com/embed/VqaX7fLh9pQ" title="Video 2"
                            allowfullscreen></iframe>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="video-container ratio ratio-16x9">
                        <iframe src="https://www.youtube.com/embed/5YLt88iJwms" title="Video 3"
                            allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section id="download" class="container text-center">
        <h2 class="fw-bold mb-5">立即加入我們</h2>
        <div class="row justify-content-center g-4">
            <div class="col-6 col-sm-4 col-md-3">
                <a href="https://play.google.com/store/..." class="download-btn">
                    <img src="./image/googleplay.png" class="img-fluid" alt="Google Play">
                </a>
            </div>
            <div class="col-6 col-sm-4 col-md-3">
                <a href="https://apps.apple.com/..." class="download-btn">
                    <img src="./image/appstore.png" class="img-fluid" alt="App Store">
                </a>
            </div>
            <div class="col-6 col-sm-4 col-md-3">
                <a href="https://store.steampowered.com/3198850/_/" class="download-btn">
                    <img src="./image/steam.png" class="img-fluid" alt="Steam">
                </a>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Play Together Fan Page. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
